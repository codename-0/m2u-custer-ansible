---
- name: Install ArgoCD and bootstrap app-of-apps
  hosts: control_plane
  become: false
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

  tasks:
    - name: Create argocd namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "argocd"
        state: present

    - name: Install ArgoCD from official manifests
      kubernetes.core.k8s:
        state: present
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"
        namespace: "argocd"
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: Wait for argocd-server deployment to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "argocd-server"
        namespace: "argocd"
      register: argocd_deployment
      until: >
        argocd_deployment.resources | length > 0
        and (argocd_deployment.resources[0].status.readyReplicas | default(0)) > 0
      retries: 30
      delay: 10

    - name: Scale down unused ArgoCD deployments to save memory
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item }}"
        namespace: "argocd"
        definition:
          spec:
            replicas: 0
      loop:
        - argocd-dex-server
        - argocd-notifications-controller

    - name: Apply root Application (app-of-apps pattern) from repository
      kubernetes.core.k8s:
        state: present
        src: "https://raw.githubusercontent.com/codename-0/m2u-app-of-apps/HEAD/bootstrap.yaml"
        namespace: "argocd"

    - name: Fetch list of ArgoCD applications for status check
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "argocd"
      register: apps_info

    - name: Print deployed applications summary
      ansible.builtin.debug:
        msg: "{{ apps_info.resources | map(attribute='metadata.name') | list }}"